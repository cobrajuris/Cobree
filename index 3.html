  const [erro, setErro] = React.useState(null);
  const [file, setFile] = React.useState(null);
  const [parsed, setParsed] = React.useState({ headers: [], rows: [] });
  const [mapping, setMapping] = React.useState([]);
  const [canalPadrao, setCanalPadrao] = React.useState("whatsapp");
  const [dedup, setDedup] = React.useState(true);
  const [resultado, setResultado] = React.useState({ add: 0, total: 0 });
  const inputRef = React.useRef(null);

  const CAMPOS = [
    { v: "nome", label: "Nome / Razão Social" },
    { v: "documento", label: "CPF / CNPJ" },
    { v: "telefone", label: "Telefone (WhatsApp/SMS)" },
    { v: "email", label: "E-mail" },
    { v: "fatura", label: "Nº da Fatura / Título / NF" },
    { v: "valor", label: "Valor do Débito" },
    { v: "vencimento", label: "Data de Vencimento" },
    { v: "parcelas", label: "Parcela (ex.: 3/12)" },
    { v: "dias", label: "Dias em Atraso" },
    { v: "situacao", label: "Situação / Status" },
    { v: "ignorar", label: "— Ignorar coluna —" },
  ];

  async function handleFile(f) {
    if (!f) return;
    setBusy(true); setErro(null);
    try {
      const res = await cjParseFile(f);
      if (!res.headers.length || !res.rows.length) throw new Error("A planilha parece vazia ou sem cabeçalho.");
      setFile(f);
      setParsed(res);
      setMapping(res.headers.map((h) => cjGuessField(h)));
      setStep(1);
    } catch (e) {
      setErro(e.message || "Não foi possível ler o arquivo. Verifique o formato (.xlsx, .xls ou .csv).");
    } finally {
      setBusy(false);
    }
  }

  function onDrop(e) {
    e.preventDefault(); setOver(false);
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f);
  }

  // contagem prévia de linhas válidas (precisa de nome mapeado)
  const previaDevedores = React.useMemo(() => {
    if (step !== 1) return [];
    return cjRowsToDevedores(parsed.headers, parsed.rows, mapping, canalPadrao);
  }, [step, parsed, mapping, canalPadrao]);
  const semContato = React.useMemo(() => previaDevedores.filter((d) => !d.tel || d.tel === "—").length, [previaDevedores]);

  const temNome = mapping.includes("nome");
  const temValor = mapping.includes("valor");

  function finish() {
    let lista = previaDevedores;
    if (dedup) {
      const seen = new Set();
      lista = lista.filter((d) => (seen.has(d.id) ? false : (seen.add(d.id), true)));
    }
    const add = CJStore.addDevedores(lista);
    CJStore.pushNotif({ tipo: "alert", canal: "email", titulo: "Importação concluída", texto: `${add} devedores adicionados à base de cobrança.` });
    setResultado({ add, total: lista.length });
    setStep(2);
    pushToast({ variant: "success", title: "Importação concluída", msg: `${add} devedores adicionados à régua de cobrança.` });
  }

  function reset() {
    setFile(null); setParsed({ headers: [], rows: [] }); setMapping([]); setErro(null); setStep(0);
  }

  return (
    <React.Fragment>
      {/* Steps header */}
      <div className="cj-steps">
        {["Enviar arquivo", "Mapear colunas", "Concluído"].map((label, i) => (
          <React.Fragment key={label}>
            {i > 0 && <div className="cj-step__bar" style={step >= i ? { background: "var(--green-300)" } : null}></div>}
            <div className={"cj-step" + (step === i ? " cj-step--active" : step > i ? " cj-step--done" : "")}>
              <span className="cj-step__num">{step > i ? <CJIcon name="check" size={16} /> : i + 1}</span>
              <span className="cj-step__label">{label}</span>
            </div>
          </React.Fragment>
        ))}
      </div>

      {/* hidden input always present */}
      <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: "none" }}
        onChange={(e) => handleFile(e.target.files && e.target.files[0])} />

      {/* STEP 0 — upload */}
      {step === 0 && (
        <div style={{ maxWidth: 760 }}>
          <div
            className={"cj-dropzone" + (over ? " cj-dropzone--over" : "")}
            onClick={() => inputRef.current && inputRef.current.click()}
            onDragOver={(e) => { e.preventDefault(); setOver(true); }}
            onDragLeave={() => setOver(false)}
            onDrop={onDrop}
          >
            <span className="cj-dropzone__icon"><CJIcon name={busy ? "refresh" : "sheet"} size={30} className={busy ? "cj-spin" : ""} /></span>
            <div className="cj-dropzone__title">{busy ? "Lendo a planilha…" : "Arraste a planilha aqui ou clique para selecionar"}</div>
            <div className="cj-dropzone__hint">Formatos aceitos: .xlsx, .xls, .csv — leitura real do arquivo, até 5.000 linhas</div>
            <Button variant="secondary" leftIcon={<CJIcon name="upload" size={16} />}>Selecionar arquivo</Button>
          </div>

          {erro && (
            <div className="cj-card cj-card--pad" style={{ marginTop: "var(--space-4)", display: "flex", gap: "var(--space-3)", alignItems: "flex-start", borderColor: "var(--danger-200)", background: "var(--danger-50)" }}>
              <span style={{ color: "var(--danger-600)", flex: "none", marginTop: 2 }}><CJIcon name="alert" size={18} /></span>
              <span style={{ fontSize: "var(--text-sm)", color: "var(--danger-700)" }}>{erro}</span>
            </div>
          )}

          <div className="cj-card cj-card--pad" style={{ marginTop: "var(--space-5)", display: "flex", gap: "var(--space-4)", alignItems: "flex-start" }}>
            <span style={{ color: "var(--info-600)", flex: "none", marginTop: 2 }}><CJIcon name="fileText" size={20} /></span>
            <div className="cj-stack" style={{ gap: 4 }}>
              <span style={{ fontWeight: 700, color: "var(--text-strong)", fontSize: "var(--text-sm)" }}>Não tem um modelo?</span>
              <span className="cj-muted" style={{ fontSize: "var(--text-sm)" }}>Baixe a planilha padrão Cobree (.csv) com as colunas já formatadas: nome, documento, telefone, e-mail, fatura, valor e vencimento.</span>
              <a href="#" onClick={(e) => { e.preventDefault(); baixarModelo(); }} style={{ fontSize: "var(--text-sm)", fontWeight: 700, marginTop: 4, display: "inline-flex", alignItems: "center", gap: 4 }}>
                <CJIcon name="download" size={15} /> Baixar modelo .csv
              </a>
            </div>
          </div>
        </div>
      )}

      {/* STEP 1 — mapping */}
      {step === 1 && (
        <div className="cj-grid" style={{ gridTemplateColumns: "1.4fr 1fr", gap: "var(--space-6)", alignItems: "start" }}>
          <div className="cj-stack" style={{ gap: "var(--space-5)" }}>
            <div className="cj-card">
              <div className="cj-filecard">
                <span className="cj-filecard__icon"><CJIcon name="sheet" size={22} /></span>
                <div className="cj-filecard__meta">
                  <div className="cj-filecard__name">{file ? file.name : "planilha"}</div>
                  <div className="cj-filecard__sub">{parsed.rows.length} linhas · {parsed.headers.length} colunas · {file ? Math.max(1, Math.round(file.size / 1024)) + " KB" : ""}</div>
                </div>
                <Badge variant="success" dot>Lido</Badge>
                <button className="cj-iconbtn cj-iconbtn--sm" onClick={reset} title="Remover"><CJIcon name="trash" size={16} /></button>
              </div>
            </div>

            <div className="cj-card cj-card--pad">
              <div className="cj-section__title" style={{ marginBottom: "var(--space-2)" }}>Mapeamento de colunas</div>
              <p className="cj-muted" style={{ fontSize: "var(--text-sm)", marginBottom: "var(--space-4)" }}>Detectamos as colunas automaticamente. Ajuste a correspondência se necessário.</p>
              {parsed.headers.map((h, i) => (
                <div key={i} className="cj-maprow">
                  <span className="cj-mapcol"><span className="cj-mapcol__dot" style={mapping[i] === "ignorar" ? { background: "var(--border-default)" } : null}></span>{h || <em className="cj-muted">coluna {i + 1}</em>}</span>
                  <span className="cj-maparrow"><CJIcon name="arrowRight" size={16} /></span>
                  <select className="cj-select" value={mapping[i]} style={{ height: 36 }}
                    onChange={(e) => setMapping((m) => m.map((x, j) => (j === i ? e.target.value : x)))}>
                    {CAMPOS.map((c) => <option key={c.v} value={c.v}>{c.label}</option>)}
                  </select>
                </div>
              ))}
            </div>

            {/* amostra real */}
            <div className="cj-card cj-card--pad">
              <div className="cj-section__title" style={{ marginBottom: "var(--space-3)" }}>Amostra ({Math.min(3, previaDevedores.length)} de {previaDevedores.length})</div>
              <div className="cj-table-wrap" style={{ border: "1px solid var(--border-subtle)", borderRadius: "var(--radius-md)" }}>
                <table className="cj-table">
                  <thead><tr><th>Nome</th><th>Documento</th><th>Valor</th><th>Atraso</th></tr></thead>
                  <tbody>
                    {previaDevedores.slice(0, 3).map((d, i) => (
                      <tr key={i}>
                        <td style={{ fontWeight: 600 }}>{d.nome}</td>
                        <td className="cj-namecell__meta">{d.doc}</td>
                        <td className="cj-td--num">{CJ_FMT(d.valor)}</td>
                        <td className="cj-muted">{d.dias > 0 ? d.dias + "d" : "—"}</td>
                      </tr>
                    ))}
                    {previaDevedores.length === 0 && <tr><td colSpan={4} className="cj-muted" style={{ textAlign: "center", padding: "var(--space-4)" }}>Mapeie a coluna “Nome” para ver a amostra.</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          {/* Right: options + counts */}
          <div className="cj-stack" style={{ gap: "var(--space-5)" }}>
            <div className="cj-card cj-card--pad">
              <div className="cj-section__title" style={{ marginBottom: "var(--space-4)" }}>Opções de importação</div>
              <label className="cj-switch" style={{ justifyContent: "space-between", width: "100%", marginBottom: "var(--space-4)", cursor: "pointer" }}>
                <span>Ignorar duplicados (por fatura)</span>
                <input type="checkbox" checked={dedup} onChange={(e) => setDedup(e.target.checked)} /><span className="cj-switch__track"><span className="cj-switch__thumb"></span></span>
              </label>
              <div className="cj-field" style={{ marginTop: "var(--space-2)" }}>
                <label className="cj-label">Canal padrão de cobrança</label>
                <select className="cj-select" value={canalPadrao} onChange={(e) => setCanalPadrao(e.target.value)}>
                  <option value="whatsapp">WhatsApp</option>
                  <option value="email">E-mail</option>
                  <option value="sms">SMS</option>
                  <option value="auto">Automático (por contato disponível)</option>
                </select>
              </div>
            </div>

            <div className="cj-card cj-card--pad" style={{ background: "var(--green-50)", border: "1px solid var(--green-200)" }}>
              <div className="cj-row" style={{ justifyContent: "space-between" }}>
                <span className="cj-muted" style={{ fontSize: "var(--text-sm)" }}>Linhas no arquivo</span>
                <span style={{ fontWeight: 700, color: "var(--text-strong)" }}>{parsed.rows.length}</span>
              </div>
              <div className="cj-row" style={{ justifyContent: "space-between", marginTop: 8 }}>
                <span className="cj-muted" style={{ fontSize: "var(--text-sm)" }}>Devedores válidos</span>
                <span style={{ fontWeight: 700, color: "var(--green-800)" }}>{previaDevedores.length}</span>
              </div>
              <div className="cj-row" style={{ justifyContent: "space-between", marginTop: 8 }}>
                <span className="cj-muted" style={{ fontSize: "var(--text-sm)" }}>Sem contato (tel/e-mail)</span>
                <span style={{ fontWeight: 700, color: semContato > 0 ? "var(--warning-700)" : "var(--green-800)" }}>{semContato}</span>
              </div>
              {!temValor && <div className="cj-row" style={{ marginTop: 8 }}><span style={{ fontSize: "var(--text-xs)", color: "var(--warning-700)" }}>Dica: mapeie a coluna “Valor” para registrar os débitos.</span></div>}
              {semContato > 0 && <div className="cj-row" style={{ marginTop: 10, gap: 8, alignItems: "flex-start" }}><span style={{ color: "var(--warning-600)", flex: "none", marginTop: 1 }}><CJIcon name="alert" size={15} /></span><span style={{ fontSize: "var(--text-xs)", color: "var(--warning-700)", lineHeight: 1.45 }}>{semContato} cliente(s) sem telefone/e-mail na planilha. Eles entram na lista, mas o disparo real só sai depois que você completar o contato (na tela do devedor).</span></div>}
            </div>

            <div className="cj-row" style={{ gap: "var(--space-3)" }}>
              <Button variant="secondary" block onClick={reset}>Voltar</Button>
              <Button block onClick={finish} disabled={!temNome || previaDevedores.length === 0} rightIcon={<CJIcon name="check" size={17} />}>Importar {previaDevedores.length}</Button>
            </div>
          </div>
        </div>
      )}

      {/* STEP 2 — done */}
      {step === 2 && (
        <div className="cj-card" style={{ maxWidth: 620, margin: "0 auto" }}>
          <div className="cj-empty">
            <span className="cj-empty__icon" style={{ width: 64, height: 64 }}><CJIcon name="checkCircle" size={30} /></span>
            <div className="cj-empty__title" style={{ fontSize: "var(--text-xl)" }}>Importação concluída</div>
            <p className="cj-empty__text">{resultado.add} devedores foram adicionados{resultado.total > resultado.add ? ` (${resultado.total - resultado.add} duplicados ignorados)` : ""}. Eles já aparecem na lista de devedores e entram na régua automática.</p>
            <div className="cj-row" style={{ gap: "var(--space-3)", marginTop: "var(--space-3)" }}>
              <Button variant="secondary" onClick={reset} leftIcon={<CJIcon name="upload" size={16} />}>Importar outra</Button>
              <Button onClick={() => onNav("devedores")} rightIcon={<CJIcon name="arrowRight" size={16} />}>Ver devedores</Button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function baixarModelo() {
  const head = "nome;documento;telefone;email;fatura;valor;vencimento";
  const ex = [
    "João da Silva;123.456.789-00;(11) 98888-0000;joao@email.com;FAT-2026-0001;4.820,50;10/05/2026",
    "Construtora Exemplo LTDA;12.345.678/0001-90;;financeiro@exemplo.com;FAT-2026-0002;28.740,00;01/06/2026",
    "Maria Souza;987.654.321-00;(21) 97777-1111;;FAT-2026-0003;1.290,00;20/05/2026",
  ];
  const csv = [head, ...ex].join("\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "modelo_cobrajuris.csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.ImportacaoScreen = ImportacaoScreen;

/* ---------------- MensagensScreen ---------------- */

/* Cobree — Mensagens. Template library + live editor with
   variable insertion and channel-accurate preview (WhatsApp / e-mail). */

function MensagensScreen({ pushToast }) {
  const { templates } = useCJ();

  const [activeId, setActiveId] = React.useState(templates[0] && templates[0].id);
  const active = templates.find((t) => t.id === activeId) || templates[0];
  const [corpo, setCorpo] = React.useState(active ? active.corpo : "");
  const [assunto, setAssunto] = React.useState(active ? active.assunto : "");
  const [dirty, setDirty] = React.useState(false);
  const taRef = React.useRef(null);

  React.useEffect(() => {
    if (!active) return;
    setCorpo(active.corpo);
    setAssunto(active.assunto);
    setDirty(false);
  }, [activeId]);

  // se o modelo ativo foi removido, seleciona o primeiro
  React.useEffect(() => {
    if (!templates.find((t) => t.id === activeId) && templates[0]) setActiveId(templates[0].id);
  }, [templates.length]);

  if (!active) {
    return <div className="cj-card cj-card--pad" style={{ textAlign: "center", padding: "var(--space-12)" }}>
      <p className="cj-muted">Nenhum modelo. <a href="#" onClick={(e) => { e.preventDefault(); const n = CJStore.addTemplate({}); setActiveId(n.id); }}>Criar o primeiro</a>.</p>
    </div>;
  }

  function novoModelo() { const n = CJStore.addTemplate({}); setActiveId(n.id); pushToast({ variant: "success", title: "Modelo criado", msg: "Edite o conteúdo e salve." }); }
  function duplicar() { const n = CJStore.duplicateTemplate(active.id); if (n) { setActiveId(n.id); pushToast({ variant: "success", title: "Modelo duplicado" }); } }
  function salvar() { CJStore.saveTemplate(active.id, { corpo, assunto }); setDirty(false); pushToast({ variant: "success", title: "Modelo salvo", msg: "As alterações foram aplicadas." }); }
  function alternarAtivo() { CJStore.toggleTemplate(active.id); pushToast({ variant: "info", title: active.ativo ? "Modelo desativado" : "Modelo ativado" }); }
  function excluir() { const id = active.id; CJStore.removeTemplate(id); pushToast({ variant: "danger", title: "Modelo excluído" }); }

  const VAR_GROUPS = [
    { grupo: "Dados do devedor", vars: [
      { tag: "{{nome}}", label: "Nome" },
      { tag: "{{fatura}}", label: "Nº da fatura" },
      { tag: "{{valor}}", label: "Valor do débito" },
      { tag: "{{vencimento}}", label: "Vencimento" },
      { tag: "{{dias}}", label: "Dias de atraso" },
      { tag: "{{empresa}}", label: "Empresa" },
      { tag: "{{cnpj}}", label: "CNPJ" },
    ] },
    { grupo: "Facilitar pagamento", vars: [
      { tag: "{{pix_copia_cola}}", label: "Pix copia e cola (valor já preenchido)" },
      { tag: "{{link_acordo}}", label: "Link de autoatendimento de acordo" },
      { tag: "{{prazo_limite}}", label: "Prazo limite (hoje + 5 dias úteis)" },
      { tag: "{{valor_desconto}}", label: "Valor com desconto (à vista)" },
    ] },
  ];

  function insertVar(tag) {
    const ta = taRef.current;
    setDirty(true);
    if (!ta) { setCorpo((c) => c + tag); return; }
    const s = ta.selectionStart, e = ta.selectionEnd;
    const next = corpo.slice(0, s) + tag + corpo.slice(e);
    setCorpo(next);
    requestAnimationFrame(() => { ta.focus(); ta.selectionStart = ta.selectionEnd = s + tag.length; });
  }

  // resolve preview with sample data (devedor exemplo)
  const exemplo = { id: "FAT-2024-0182", nome: "Marcos Antônio Pereira", valor: 4820.50, dias: 47 };
  const sample = {
    "{{nome}}": exemplo.nome,
    "{{fatura}}": exemplo.id,
    "{{valor}}": "R$ 4.820,50",
    "{{valor_desconto}}": "R$ 2.892,30",
    "{{vencimento}}": "10/05/2026",
    "{{dias}}": "47",
    "{{empresa}}": "Aurora Peças & Diesel",
    "{{cnpj}}": "12.345.678/0001-90",
    "{{prazo_limite}}": (typeof cjPrazoLimite === "function" ? cjPrazoLimite(5) : "17 de junho de 2026"),
    "{{link_acordo}}": "cobree.app/acordo/40182",
    "{{pix_copia_cola}}": "00020126360014BR.GOV.BCB.PIX…5802BR…6304A1B2",
  };
  const resolved = corpo.replace(/\{\{\w+\}\}/g, (m) => sample[m] || m);
  const resolvedSubject = assunto.replace(/\{\{\w+\}\}/g, (m) => sample[m] || m);

  return (
    <div className="cj-editor">
      {/* LEFT — template list */}
      <div className="cj-editor__list">
        <div className="cj-editor__list-head">
          <span className="cj-editor__list-title">Modelos</span>
          <button className="cj-iconbtn cj-iconbtn--sm cj-iconbtn--outline" title="Novo modelo" onClick={novoModelo}><CJIcon name="plus" size={16} /></button>
        </div>
        <div style={{ overflowY: "auto" }}>
          {templates.map((t) => {
            const cn = CJ_CANAL_LABEL[t.canal];
            return (
              <button key={t.id} className={"cj-tplitem" + (t.id === activeId ? " cj-tplitem--active" : "")} onClick={() => setActiveId(t.id)}>
                <div className="cj-tplitem__name">{t.nome}</div>
                <div className="cj-tplitem__meta">
                  <span className={`cj-canal cj-canal--${t.canal}`}><CJIcon name={cn.icon} size={13} /> {cn.label}</span>
                  {!t.ativo && <Badge variant="neutral">Inativo</Badge>}
                  <span className="cj-tplitem__uses">{t.usos} usos</span>
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* CENTER — editor */}
      <div className="cj-editor__main">
        <div className="cj-row" style={{ justifyContent: "space-between", gap: "var(--space-3)" }}>
          <div className="cj-stack" style={{ minWidth: 0 }}>
            <input className="cj-input" value={active.nome} readOnly style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: "var(--text-md)", border: "none", padding: 0, height: "auto", background: "transparent" }} />
            <div className="cj-row cj-gap-2" style={{ marginTop: 4 }}>
              <span className={`cj-canal cj-canal--${active.canal}`}><CJIcon name={CJ_CANAL_LABEL[active.canal].icon} size={14} /> {CJ_CANAL_LABEL[active.canal].label}</span>
              <span className="cj-muted" style={{ fontSize: "var(--text-xs)" }}>· Tom {active.tom}</span>
            </div>
          </div>
          <div className="cj-row cj-gap-2">
            <Button variant="ghost" size="sm" onClick={alternarAtivo}>{active.ativo ? "Desativar" : "Ativar"}</Button>
            <Button variant="ghost" size="sm" leftIcon={<CJIcon name="copy" size={15} />} onClick={duplicar}>Duplicar</Button>
            <Button variant="ghost" size="sm" leftIcon={<CJIcon name="trash" size={15} />} onClick={excluir}>Excluir</Button>
            <Button size="sm" leftIcon={<CJIcon name="check" size={15} />} onClick={salvar}>{dirty ? "Salvar*" : "Salvar"}</Button>
          </div>
        </div>

        {active.canal === "email" && (
          <Input label="Assunto do e-mail" value={assunto} onChange={(e) => { setAssunto(e.target.value); setDirty(true); }} />
        )}

        <div className="cj-stack" style={{ flex: 1, gap: "var(--space-2)" }}>
          <label className="cj-label">Corpo da mensagem</label>
          <div className="cj-editor__toolbar">
            {VAR_GROUPS.map((g) => (
              <div key={g.grupo} className="cj-vargroup">
                <span className="cj-vargroup__label">{g.grupo}</span>
                <div className="cj-vargroup__chips">
                  {g.vars.map((v) => (
                    <button key={v.tag} className={"cj-var" + (g.grupo === "Facilitar pagamento" ? " cj-var--pay" : "")} onClick={() => insertVar(v.tag)} title={v.label}>{v.tag}</button>
                  ))}
                </div>
              </div>

/* Cobree — Agendamentos. Active dispatch schedules (réguas)
   plus an inline "nova régua" composer with day/time/channel controls. */

function AgendamentosScreen({ pushToast }) {
  const { agendamentos, templates } = useCJ();

  const DIAS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
  const [novoDias, setNovoDias] = React.useState(() => new Set(["Seg", "Qua", "Sex"]));
  const [hora, setHora] = React.useState("09:00");
  const [canal, setCanal] = React.useState("whatsapp");
  const [nome, setNome] = React.useState("Lembrete — vencidos esta semana");
  const [tplId, setTplId] = React.useState(templates[0] && templates[0].id);
  const schedules = agendamentos;

  function toggleDia(d) {
    setNovoDias((prev) => { const n = new Set(prev); n.has(d) ? n.delete(d) : n.add(d); return n; });
  }
  function toggleStatus(id) {
    const s = schedules.find((x) => x.id === id);
    CJStore.toggleAgendamento(id);
    pushToast({ variant: "info", title: s && s.status === "ativo" ? "Régua pausada" : "Régua retomada" });
  }
  function excluir(id) {
    CJStore.removeAgendamento(id);
    pushToast({ variant: "danger", title: "Régua excluída" });
  }
  function criar() {
    if (!nome.trim() || novoDias.size === 0) { pushToast({ variant: "danger", title: "Preencha nome e dias" }); return; }
    const tpl = templates.find((t) => t.id === tplId) || templates[0];
    const diasOrd = DIAS.filter((d) => novoDias.has(d));
    CJStore.addAgendamento({ nome: nome.trim(), template: tpl ? tpl.nome : "—", canal, hora, dias: diasOrd, alvos: 0 });
    CJStore.pushNotif({ tipo: "alert", canal, titulo: "Régua criada", texto: `“${nome.trim()}” entrou na fila de disparos.` });
    pushToast({ variant: "success", title: "Régua criada", msg: "A nova régua está ativa e entrará na fila." });
    setNome("Nova régua de cobrança");
  }

  return (
    <div className="cj-grid" style={{ gridTemplateColumns: "1.55fr 1fr", gap: "var(--space-6)", alignItems: "start" }}>
      {/* LEFT — active schedules */}
      <div className="cj-stack" style={{ gap: "var(--space-5)" }}>
        <div className="cj-section__head" style={{ marginBottom: 0 }}>
          <div className="cj-section__title">Réguas de cobrança</div>
          <Badge variant="brand">{schedules.filter((s) => s.status === "ativo").length} ativas</Badge>
        </div>

        {schedules.map((s) => {
          const cn = CJ_CANAL_LABEL[s.canal];
          const ativo = s.status === "ativo";
          return (
            <div key={s.id} className="cj-card cj-schedcard">
              <div className="cj-schedcard__head">
                <span style={{ width: 42, height: 42, borderRadius: 12, flex: "none", background: ativo ? "var(--green-50)" : "var(--surface-subtle)", color: ativo ? "var(--green-600)" : "var(--text-muted)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                  <CJIcon name="zap" size={20} />
                </span>
                <div className="cj-stack" style={{ flex: 1 }}>
                  <span className="cj-schedcard__title">{s.nome}</span>
                  <span className="cj-schedcard__tpl">Modelo: {s.template}</span>
                </div>
                <Badge variant={ativo ? "success" : "neutral"} dot>{ativo ? "Ativa" : "Pausada"}</Badge>
              </div>

              <div className="cj-schedcard__grid">
                <div>
                  <div className="cj-schedcard__field-label">Canal</div>
                  <div className="cj-schedcard__field-value"><span className={`cj-canal cj-canal--${s.canal}`}><CJIcon name={cn.icon} size={15} /> {cn.label}</span></div>
                </div>
                <div>
                  <div className="cj-schedcard__field-label">Horário</div>
                  <div className="cj-schedcard__field-value"><CJIcon name="clock" size={14} /> {s.hora}</div>
                </div>
                <div>
                  <div className="cj-schedcard__field-label">Dias</div>
                  <div className="cj-daypills" style={{ marginTop: 4 }}>
                    {DIAS.map((d) => <span key={d} className={"cj-daypill" + (s.dias.includes(d) ? " cj-daypill--on" : "")}>{d[0]}</span>)}
                  </div>
                </div>
                <div>
                  <div className="cj-schedcard__field-label">Alvos na fila</div>
                  <div className="cj-schedcard__field-value tnum">{s.alvos} devedores</div>
                </div>
              </div>

              <div className="cj-schedcard__foot">
                <span className="cj-nextrun"><CJIcon name="calendar" size={14} /> Próximo disparo: <strong>{s.proximo}</strong></span>
                <div className="cj-row cj-gap-2">
                  <Button variant="ghost" size="sm" leftIcon={<CJIcon name="trash" size={15} />} onClick={() => excluir(s.id)}>Excluir</Button>
                  <Button variant="secondary" size="sm" leftIcon={<CJIcon name={ativo ? "pause" : "play"} size={15} />} onClick={() => toggleStatus(s.id)}>
                    {ativo ? "Pausar" : "Retomar"}
                  </Button>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* RIGHT — new schedule composer */}
      <div className="cj-card cj-card--pad" style={{ position: "sticky", top: "calc(var(--topbar-height) + var(--space-6))" }}>
        <div className="cj-row cj-gap-3" style={{ marginBottom: "var(--space-5)" }}>
          <span style={{ width: 38, height: 38, borderRadius: 10, background: "var(--green-600)", color: "#fff", display: "inline-flex", alignItems: "center", justifyContent: "center", flex: "none" }}><CJIcon name="plus" size={18} /></span>
          <div className="cj-stack">
            <span className="cj-section__title">Nova régua</span>
            <span className="cj-muted" style={{ fontSize: "var(--text-xs)" }}>Agende disparos automáticos</span>
          </div>
        </div>

        <div className="cj-field" style={{ marginBottom: "var(--space-4)" }}>
          <label className="cj-label">Nome da régua</label>
          <input className="cj-input" value={nome} onChange={(e) => setNome(e.target.value)} />
        </div>

        <div className="cj-field" style={{ marginBottom: "var(--space-4)" }}>
          <label className="cj-label">Modelo de mensagem</label>
          <select className="cj-select" value={tplId} onChange={(e) => setTplId(e.target.value)}>
            {templates.map((t) => <option key={t.id} value={t.id}>{t.nome}</option>)}
          </select>
        </div>

        <div className="cj-field" style={{ marginBottom: "var(--space-4)" }}>
          <label className="cj-label">Canal</label>
          <div className="cj-row cj-gap-2">
            {Object.entries(CJ_CANAL_LABEL).map(([k, v]) => (
              <button key={k} className={"cj-chip" + (canal === k ? " cj-chip--active" : "")} onClick={() => setCanal(k)} style={{ flex: 1, justifyContent: "center" }}>
                <CJIcon name={v.icon} size={15} /> {v.label}
              </button>
            ))}
          </div>
        </div>

        <div className="cj-field" style={{ marginBottom: "var(--space-4)" }}>
          <label className="cj-label">Dias da semana</label>
          <div className="cj-daypills">
            {DIAS.map((d) => (
              <button key={d} className={"cj-daypill" + (novoDias.has(d) ? " cj-daypill--on" : "")} onClick={() => toggleDia(d)} style={{ width: 34, height: 34, cursor: "pointer" }}>{d[0]}</button>
            ))}
          </div>
        </div>

        <div className="cj-row cj-gap-3" style={{ marginBottom: "var(--space-5)" }}>
          <div className="cj-field" style={{ flex: 1 }}>
            <label className="cj-label">Horário</label>
            <input type="time" className="cj-input" value={hora} onChange={(e) => setHora(e.target.value)} />
          </div>
          <div className="cj-field" style={{ flex: 1 }}>
            <label className="cj-label">Limite diário</label>
            <input className="cj-input" defaultValue="80" type="number" />
          </div>
        </div>

        <div className="cj-card" style={{ background: "var(--green-50)", border: "1px solid var(--green-200)", padding: "var(--space-3) var(--space-4)", marginBottom: "var(--space-5)", display: "flex", gap: 10, alignItems: "flex-start" }}>
          <span style={{ color: "var(--green-600)", flex: "none", marginTop: 1 }}><CJIcon name="clock" size={16} /></span>
          <span style={{ fontSize: "var(--text-xs)", color: "var(--green-800)" }}>Respeita o horário comercial (8h–20h) e não dispara em feriados nacionais.</span>
        </div>

        <Button block size="lg" onClick={criar} leftIcon={<CJIcon name="zap" size={17} />}>Criar régua</Button>
      </div>
    </div>
  );
}

/* ----- Exportação de relatório mensal em Excel, branded Cobree -----
   Gera um .xls (HTML-table) que o Excel abre com as cores da marca:
   cabeçalho verde-petróleo, faixa da marca, zebra verde-claro. */
function baixarRelatorioExcel(mesNome, ano, devedores, k, canais, hist, ranking) {
  const G_DARK = "#0B4A36", G = "#0F6E4E", G_MID = "#1B8761", G_LIGHT = "#EAF5EF", G_LINE = "#CFE6DA", INK = "#0E1B17", MUTED = "#5E6B62";
  const fmt = (v) => "R$ " + (v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const statusCount = (s) => devedores.filter((d) => d.status === s).length;
  const statusSoma = (s) => devedores.filter((d) => d.status === s).reduce((a, d) => a + d.valor, 0);

  const canalLabel = { whatsapp: "WhatsApp", email: "E-mail", sms: "SMS" };
  const statusRows = [
    ["Em atraso", statusCount("overdue"), statusSoma("overdue")],
    ["A vencer", statusCount("pending"), statusSoma("pending")],
    ["Enviados", statusCount("sent"), statusSoma("sent")],
    ["Agendados", statusCount("scheduled"), statusSoma("scheduled")],
    ["Quitados", statusCount("paid"), statusSoma("paid")],
  ];

  const cap = (lbl) => `<td style="background:${G};color:#fff;font-weight:700;padding:8px 12px;border:1px solid ${G_DARK};">${lbl}</td>`;
  const th = (lbl, align) => `<td style="background:${G_MID};color:#fff;font-weight:700;padding:7px 12px;border:1px solid ${G_LINE};text-align:${align||"left"};">${lbl}</td>`;
  const td = (v, i, align) => `<td style="background:${i % 2 ? "#fff" : G_LIGHT};color:${INK};padding:6px 12px;border:1px solid ${G_LINE};text-align:${align||"left"};">${v}</td>`;
  const spacer = `<tr><td colspan="4" style="height:10px;"></td></tr>`;

  let rows = "";
  // Marca / cabeçalho
  rows += `<tr><td colspan="4" style="background:${G_DARK};color:#fff;font-size:22px;font-weight:700;padding:16px 14px;border:1px solid ${G_DARK};">⚖ Cobree</td></tr>`;
  rows += `<tr><td colspan="4" style="background:${G};color:#fff;font-size:14px;padding:8px 14px;border:1px solid ${G_DARK};">Relatório Mensal de Cobrança — ${mesNome} de ${ano}</td></tr>`;
  rows += `<tr><td colspan="4" style="color:${MUTED};font-size:11px;padding:6px 14px;">Aurora Peças & Diesel Ltda · Gerado em ${new Date().toLocaleDateString("pt-BR")} · Cobree</td></tr>`;
  rows += spacer;

  // KPIs
  rows += `<tr>${cap("Indicadores do mês")}<td colspan="3" style="border:1px solid ${G_DARK};background:${G};"></td></tr>`;
  rows += `<tr>${th("Indicador")}${th("Valor", "right")}<td style="border:none;"></td><td style="border:none;"></td></tr>`;
  const kpis = [
    ["Total a receber (em aberto)", fmt(k.aReceber)],
    ["Recuperado / quitado", fmt(k.recuperado)],
    ["Faturas em atraso", String(k.emAtraso)],
    ["Total de devedores", String(k.total)],
    ["Taxa de quitação", (k.total ? Math.round(statusCount("paid") / k.total * 100) : 0) + "%"],
  ];
  kpis.forEach((r, i) => { rows += `<tr>${td(r[0], i)}${td(r[1], i, "right")}<td style="border:none;"></td><td style="border:none;"></td></tr>`; });
  rows += spacer;

  // Situação da carteira
  rows += `<tr>${cap("Situação da carteira")}<td colspan="3" style="border:1px solid ${G_DARK};background:${G};"></td></tr>`;
  rows += `<tr>${th("Situação")}${th("Qtde", "center")}${th("Valor", "right")}<td style="border:none;"></td></tr>`;
  statusRows.forEach((r, i) => { rows += `<tr>${td(r[0], i)}${td(r[1], i, "center")}${td(fmt(r[2]), i, "right")}<td style="border:none;"></td></tr>`; });
  rows += spacer;

  // Desempenho por canal
  rows += `<tr>${cap("Desempenho por canal")}<td colspan="3" style="border:1px solid ${G_DARK};background:${G};"></td></tr>`;
  rows += `<tr>${th("Canal")}${th("Enviados", "center")}${th("Resposta", "center")}${th("Acordo", "center")}</tr>`;
  canais.forEach((c, i) => { rows += `<tr>${td(canalLabel[c.canal] || c.canal, i)}${td(c.env.toLocaleString("pt-BR"), i, "center")}${td(c.resp + "%", i, "center")}${td(c.acordo + "%", i, "center")}</tr>`; });
  rows += spacer;

  // Recuperação por mês
  rows += `<tr>${cap("Recuperação por mês (R$ mil)")}<td colspan="3" style="border:1px solid ${G_DARK};background:${G};"></td></tr>`;
  rows += `<tr>${th("Mês")}${th("Recuperado", "right")}${th("Meta", "right")}<td style="border:none;"></td></tr>`;
  hist.forEach((h, i) => { rows += `<tr>${td(h.mes, i)}${td(fmt(h.recuperado * 1000), i, "right")}${td(fmt(h.meta * 1000), i, "right")}<td style="border:none;"></td></tr>`; });
  rows += spacer;

  // Devedores detalhados
  rows += `<tr>${cap("Devedores")}<td colspan="3" style="border:1px solid ${G_DARK};background:${G};"></td></tr>`;
  rows += `<tr>${th("Fatura")}${th("Nome")}${th("Valor", "right")}${th("Situação", "center")}</tr>`;
  const stLabel = { overdue: "Em atraso", pending: "A vencer", paid: "Quitado", scheduled: "Agendado", sent: "Enviado" };
  devedores.forEach((d, i) => { rows += `<tr>${td(d.id, i)}${td(d.nome, i)}${td(fmt(d.valor), i, "right")}${td(stLabel[d.status] || d.status, i, "center")}</tr>`; });

  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>${mesNome} ${ano}</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body><table style="font-family:Calibri,Arial,sans-serif;border-collapse:collapse;"><colgroup><col style="width:200px"><col style="width:200px"><col style="width:120px"><col style="width:120px"></colgroup>${rows}</table></body></html>`;

  const blob = new Blob(["\ufeff" + html], { type: "application/vnd.ms-excel;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Cobree_Relatorio_${mesNome}_${ano}.xls`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

      <div className="cj-stack" style={{ gap: 16 }}>{children}</div>

}
function SetField({ label, children }) {
  return (<label className="cj-set__field"><span className="cj-set__label">{label}</span>{children}</label>);
}
function SetSwitch({ on, onClick }) {
  return (<button className={"cj-set__switch" + (on ? " is-on" : "")} onClick={onClick} aria-pressed={on}><span className="cj-set__switch-thumb"></span></button>);
}

/* Cobree — Detalhe do devedor. Drawer lateral aberto pela busca
   (ou pela ação "ver" na lista). Mostra dados, contato, KPIs e o
   histórico de mensagens disparadas. */

function SituacaoEditor({ d, pushToast }) {
  const OPCOES = [
    { k: "overdue", label: "Em atraso", badge: "danger" },
    { k: "pending", label: "Devendo", badge: "warning" },
    { k: "paid", label: "Quitado", badge: "success" },
  ];
  function mudar(k) {
    if (k === d.status) return;
    if (k === "paid") {
      CJStore.markPaid(d.id);
      pushToast && pushToast({ variant: "success", title: "Marcado como quitado", msg: shortName(d.nome) + " — débito baixado." });
    } else {
      CJStore.updateDevedor(d.id, { status: k, ultimo: "Agora" });
      pushToast && pushToast({ variant: "info", title: "Situação atualizada", msg: shortName(d.nome) + " agora está \u201c" + (k === "overdue" ? "Em atraso" : "Devendo") + "\u201d." });
    }
  }
  return (
    <div className="cj-row cj-gap-2">
      {OPCOES.map((o) => (
        <button key={o.k} className={"cj-chip" + (d.status === o.k ? " cj-chip--active" : "")} onClick={() => mudar(o.k)} style={{ flex: 1, justifyContent: "center" }}>
          {d.status === o.k && <CJIcon name="check" size={14} />} {o.label}
        </button>
      ))}
    </div>
  );
}

function ContatoEditor({ d, cn, pushToast }) {
  const semContato = !d.tel || d.tel === "—";
  const [editando, setEditando] = React.useState(false);
  const [tel, setTel] = React.useState(semContato ? "" : d.tel);
  const [canal, setCanal] = React.useState(d.canal);
  React.useEffect(() => { setTel(semContato ? "" : d.tel); setCanal(d.canal); }, [d.id]);

  function salvar() {
    const v = tel.trim();
    if (!v) return;
    CJStore.updateDevedor(d.id, { tel: v, canal });
    setEditando(false);
    pushToast && pushToast({ variant: "success", title: "Contato atualizado", msg: shortName(d.nome) + " já pode receber cobranças." });
  }

  if (editando) {
    return (
      <div className="cj-stack" style={{ gap: "var(--space-3)" }}>
        <div className="cj-row cj-gap-2">
          {Object.entries(CJ_CANAL_LABEL).map(([k, v]) => (
            <button key={k} className={"cj-chip" + (canal === k ? " cj-chip--active" : "")} onClick={() => setCanal(k)} style={{ flex: 1, justifyContent: "center" }}>
              <CJIcon name={v.icon} size={14} /> {v.label}
            </button>
          ))}
        </div>
        <input className="cj-input" value={tel} onChange={(e) => setTel(e.target.value)} placeholder={canal === "email" ? "cliente@email.com" : "(11) 90000-0000"} autoFocus />
        <div className="cj-row cj-gap-2">
          <button className="cj-btn cj-btn--secondary cj-btn--sm" onClick={() => setEditando(false)}>Cancelar</button>
          <button className="cj-btn cj-btn--primary cj-btn--sm" onClick={salvar} disabled={!tel.trim()}><CJIcon name="check" size={15} />Salvar contato</button>
        </div>
      </div>
    );
  }

  if (semContato) {
    return (
      <div className="cj-drawer__contact" style={{ borderColor: "var(--warning-500)", background: "var(--warning-50)" }}>
        <span className="cj-canal" style={{ color: "var(--warning-700)" }}><CJIcon name="alert" size={16} /> Sem contato</span>
        <button className="cj-btn cj-btn--secondary cj-btn--sm" onClick={() => setEditando(true)}><CJIcon name="plus" size={14} />Adicionar</button>
      </div>
    );
  }
  return (
    <div className="cj-drawer__contact">
      <span className={"cj-canal cj-canal--" + d.canal}><CJIcon name={cn.icon} size={16} /> {cn.label}</span>
      <span className="cj-row cj-gap-2">
        <span className="cj-drawer__contact-val">{d.tel}</span>
        <button className="cj-iconbtn cj-iconbtn--sm" onClick={() => setEditando(true)} title="Editar contato"><CJIcon name="edit" size={15} /></button>
      </span>
    </div>
  );
}

        <header className="cj-drawer__head">
          <button className="cj-iconbtn cj-iconbtn--sm" onClick={onClose} title="Fechar"><CJIcon name="x" size={18} /></button>
          <span className="cj-drawer__head-id">{d.id}</span>
        </header>

        <div className="cj-drawer__id">
          <div className="cj-avatar cj-avatar--lg">{initials(d.nome)}</div>
          <div className="cj-stack" style={{ gap: 4, flex: 1, minWidth: 0 }}>
            <button className="cj-drawer__name cj-namecell__link" onClick={() => onOpenChat && onOpenChat(d)} title="Abrir conversa" style={{ textAlign: "left" }}>{d.nome}</button>
            <span className="cj-namecell__meta" style={{ fontSize: "var(--text-sm)" }}>{d.doc}</span>
          </div>
          <span className={`cj-badge cj-badge--${st.badge}`} style={{ flex: "none", alignSelf: "flex-start" }}><span className="cj-badge__dot"></span>{st.label}</span>
        </div>

        <div className="cj-drawer__kpis">
          <div className="cj-drawer__kpi"><span className="cj-drawer__kpi-label">Valor do débito</span><span className="cj-drawer__kpi-value tnum">{CJ_FMT(d.valor)}</span></div>
          <div className="cj-drawer__kpi"><span className="cj-drawer__kpi-label">Parcela</span><span className="cj-drawer__kpi-value">{d.parcelas}</span></div>
          <div className="cj-drawer__kpi"><span className="cj-drawer__kpi-label">Atraso</span><span className="cj-drawer__kpi-value" style={{ color: d.dias > 30 ? "var(--danger-600)" : "var(--text-strong)" }}>{d.dias > 0 ? d.dias + " dias" : "—"}</span></div>
        </div>

        <div className="cj-drawer__section" style={{ paddingBottom: 0 }}>
          <span className="cj-drawer__section-label">Situação</span>
          <SituacaoEditor d={d} pushToast={pushToast} />
        </div>

        <div className="cj-drawer__section">
          <span className="cj-drawer__section-label">Contato</span>
          <ContatoEditor d={d} cn={cn} pushToast={pushToast} />
        </div>

        <div className="cj-drawer__section" style={{ flex: 1, minHeight: 0, overflowY: "auto" }}>
          <span className="cj-drawer__section-label">Histórico de cobrança</span>
          <div className="cj-timeline">
            {timeline.map((t, i) => (
              <div key={i} className="cj-tl-item">
                <span className="cj-tl-dot" style={{ color: t.tone }}><CJIcon name={t.ic} size={14} /></span>
                {i < timeline.length - 1 && <span className="cj-tl-line"></span>}
                <div className="cj-stack" style={{ gap: 2, paddingBottom: 18 }}>
                  <span className="cj-tl-title">{t.titulo}</span>
                  <span className="cj-tl-sub">{t.sub}</span>
                  <span className="cj-tl-when">{t.quando}</span>
                </div>
              </div>
            ))}
          </div>
        </div>

        <footer className="cj-drawer__foot">
          <button className="cj-btn cj-btn--secondary cj-btn--md" onClick={() => { CJStore.markPaid(d.id); pushToast({ variant: "success", title: "Pagamento registrado", msg: `${shortName(d.nome)} marcado como quitado.` }); }}><CJIcon name="dollar" size={16} />Registrar pagamento</button>
          <button className="cj-btn cj-btn--primary cj-btn--md" style={{ flex: 1 }} onClick={() => { onClose(); onOpenChat && onOpenChat(d); }}><CJIcon name="message" size={16} />Abrir conversa</button>
        </footer>
      </aside>
    </React.Fragment>
  );
}

window.DevedorDetail = DevedorDetail;

/* ---------------- ChatDrawer ---------------- */

/* Cobree — Conversa do devedor. Aberta ao clicar no NOME.
   Mostra o histórico de mensagens (estilo WhatsApp / e-mail) e um
   compositor: digite ou use um modelo. Tudo que é disparado para o
   devedor (aqui, na lista, no painel ou em massa) aparece nesta thread. */

function ChatDrawer({ devedor, onClose, onOpenDetail, pushToast }) {
  const { conversas, templates } = useCJ();
  const d = devedor;

  React.useEffect(() => { CJStore.ensureConversa(d); }, [d.id]);

  const msgs = conversas[d.id] || [];
  const [texto, setTexto] = React.useState("");
  const [showTpl, setShowTpl] = React.useState(false);
  const bodyRef = React.useRef(null);
  const cn = CJ_CANAL_LABEL[d.canal];
  const st = CJ_STATUS_LABEL[d.status];

  React.useEffect(() => {
    const el = bodyRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [msgs.length, d.id]);

  function enviar(t) {
    const txt = (t != null ? t : texto).trim();
    if (!txt) return;
    CJStore.sendMensagem(d.id, { texto: txt, canal: d.canal });
    CJStore.pushAtividade({ canal: d.canal, nome: d.nome, acao: "Mensagem enviada", status: "sent" });
    setTexto("");
    setShowTpl(false);
  }
  function usarModelo(tpl) {
    enviar(cjResolveTemplate(tpl.corpo, d));
    pushToast({ variant: "info", title: "Mensagem enviada", msg: `Modelo \u201c${tpl.nome}\u201d enviado a ${shortName(d.nome)}.` });
  }
  function simularResposta() {
    CJStore.receberMensagem(d.id, "Ol\u00e1, recebi a mensagem. Consigo regularizar at\u00e9 sexta-feira, pode ser?");
  }

  const ativos = templates.filter((t) => t.ativo);

  return (
    <React.Fragment>
      <div className="cj-drawer-overlay" onClick={onClose}></div>
      <aside className={"cj-drawer cj-chat cj-chat--" + d.canal} role="dialog" aria-label={`Conversa com ${d.nome}`}>
        {/* header */}
        <header className="cj-chat__head">
          <button className="cj-iconbtn cj-iconbtn--sm cj-chat__back" onClick={onClose} title="Fechar"><CJIcon name="chevronLeft" size={18} /></button>
          <div className="cj-avatar cj-avatar--md">{initials(d.nome)}</div>
          <div className="cj-stack" style={{ flex: 1, minWidth: 0 }}>
            <span className="cj-chat__name">{shortName(d.nome)}</span>
            <span className="cj-chat__status"><CJIcon name={cn.icon} size={13} /> {cn.label} · {d.tel}</span>
          </div>
          <button className="cj-iconbtn cj-iconbtn--sm" onClick={() => onOpenDetail(d)} title="Ver dados do devedor"><CJIcon name="user" size={17} /></button>
        </header>

        {/* débito strip */}
        <div className="cj-chat__debt">
          <div className="cj-row cj-gap-2">
            <span className="cj-chat__debt-label">Débito</span>
            <span className="cj-chat__debt-value tnum">{CJ_FMT(d.valor)}</span>
            <Badge variant={st.badge} dot>{st.label}</Badge>
          </div>
          <span className="cj-chat__debt-proc">{d.id}</span>
        </div>

        {/* messages */}
        <div className="cj-chat__body" ref={bodyRef}>
          <div className="cj-chat__day">Histórico de cobrança</div>
          {msgs.map((m) => (
            <div key={m.id} className={"cj-msg cj-msg--" + m.dir}>
              <div className="cj-msg__bubble">
                {m.texto}
                <span className="cj-msg__time">{m.hora}{m.dir === "out" && <span className="cj-msg__check">{m.status === "read" ? " ✓✓" : m.status === "delivered" ? " ✓✓" : " ✓"}</span>}</span>
              </div>
            </div>
          ))}
          {msgs.length === 0 && <div className="cj-chat__empty">Nenhuma mensagem ainda. Envie a primeira cobrança abaixo.</div>}
        </div>

        {/* template picker */}
        {showTpl && (
          <div className="cj-chat__tpls">
            <div className="cj-chat__tpls-head">
              <span>Enviar com um modelo</span>
              <button className="cj-iconbtn cj-iconbtn--sm" onClick={() => setShowTpl(false)}><CJIcon name="x" size={15} /></button>
            </div>
            <div className="cj-chat__tpls-list">
              {ativos.map((t) => (
                <button key={t.id} className="cj-chat__tpl" onClick={() => usarModelo(t)}>
                  <span className="cj-chat__tpl-name">{t.nome}</span>
                  <span className="cj-chat__tpl-prev">{cjResolveTemplate(t.corpo, d).slice(0, 64)}…</span>
                </button>
              ))}
              {ativos.length === 0 && <div className="cj-chat__empty" style={{ padding: 12 }}>Nenhum modelo ativo.</div>}
            </div>
          </div>
        )}

        {/* composer */}
        <footer className="cj-chat__composer">
          <button className="cj-iconbtn cj-iconbtn--md" title="Usar modelo" onClick={() => setShowTpl((s) => !s)}><CJIcon name="fileText" size={18} /></button>
          <textarea
            className="cj-chat__input"
            placeholder={`Mensagem para ${shortName(d.nome)}…`}
            value={texto}
            onChange={(e) => setTexto(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } }}
            rows={1}
          />
          <button className="cj-chat__send" onClick={() => enviar()} disabled={!texto.trim()} title="Enviar"><CJIcon name="send" size={18} /></button>
        </footer>
        <button className="cj-chat__simular" onClick={simularResposta}>↩ Simular resposta do devedor (demo)</button>
      </aside>
    </React.Fragment>
  );
}

window.ChatDrawer = ChatDrawer;


  </script>
  <script type="text/babel">
/* ============================================================
   Cobree — Bootstrap da aplicação
   Define as páginas do menu, a fila de toasts e o componente
   App raiz (login → shell → tela ativa). É o último script
   carregado: monta a árvore React em #root.
   ============================================================ */

const { useState, useCallback } = React;

const PAGE_META = {
  dashboard:    { title: "Painel",        subtitle: "Visão geral das cobranças da empresa" },
  devedores:    { title: "Devedores",     subtitle: "Faturas e contatos em cobrança" },
  calendario:   { title: "Calendário",    subtitle: "Agenda de disparos e anotações" },
  importar:     { title: "Importar planilha", subtitle: "Adicione devedores em massa via Excel" },
  mensagens:    { title: "Mensagens",     subtitle: "Modelos de cobrança e pré-visualização" },
  agendamentos: { title: "Agendamentos",  subtitle: "Réguas de disparo automático" },
  relatorios:   { title: "Relatórios",    subtitle: "Desempenho das cobranças e recuperação" },
};

function ToastHost({ toasts }) {
  const icon = { success: "checkCircle", info: "bell", danger: "alert" };
  return (
    <div className="cj-toast-host">
      {toasts.map((t) => (
        <div key={t.id} className={`cj-toast cj-toast--${t.variant || "info"}`}>
          <span className="cj-toast__icon"><CJIcon name={icon[t.variant] || "bell"} size={18} /></span>
          <div className="cj-stack">
            <span className="cj-toast__title">{t.title}</span>
            {t.msg && <span className="cj-toast__msg">{t.msg}</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const state = useCJ();
  const authed = state.session.authed;
  const [nav, setNav] = useState("dashboard");
  const [toasts, setToasts] = useState([]);
  const [detalheId, setDetalheId] = useState(null);
  const [chatId, setChatId] = useState(null);
  const detalhe = detalheId ? state.devedores.find((d) => d.id === detalheId) : null;
  const chat = chatId ? state.devedores.find((d) => d.id === chatId) : null;
  const openDevedor = useCallback((d) => setDetalheId(d ? d.id : null), []);
  const openChat = useCallback((d) => { setDetalheId(null); setChatId(d ? d.id : null); }, []);

  const pushToast = useCallback((t) => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { ...t, id }]);
    setTimeout(() => setToasts((prev) => prev.filter((x) => x.id !== id)), 3800);
  }, []);

  const goNav = useCallback((k) => { setNav(k); window.scrollTo({ top: 0 }); }, []);

  if (!authed) {
    return <LoginScreen onLogin={() => { CJStore.login(); setNav("dashboard"); }} />;
  }

  const meta = PAGE_META[nav] || PAGE_META.dashboard;
  let screen = null;
  if (nav === "dashboard")         screen = <DashboardScreen onNav={goNav} pushToast={pushToast} onOpenDevedor={openDevedor} onOpenChat={openChat} />;
  else if (nav === "devedores")    screen = <DevedoresScreen onNav={goNav} pushToast={pushToast} onOpenDevedor={openDevedor} onOpenChat={openChat} />;
  else if (nav === "calendario")   screen = <CalendarScreen onNav={goNav} pushToast={pushToast} />;
  else if (nav === "importar")     screen = <ImportacaoScreen onNav={goNav} pushToast={pushToast} />;
  else if (nav === "mensagens")    screen = <MensagensScreen pushToast={pushToast} />;
  else if (nav === "agendamentos") screen = <AgendamentosScreen pushToast={pushToast} />;
  else if (nav === "relatorios")   screen = <RelatoriosScreen onNav={goNav} pushToast={pushToast} />;

  const actions =
    nav === "dashboard" ? <button className="cj-btn cj-btn--primary cj-btn--md" onClick={() => goNav("importar")}><CJIcon name="plus" size={16} />Nova cobrança</button> :
    null;

  return (
    <React.Fragment>
      <AppShell nav={nav} onNav={goNav} title={meta.title} subtitle={meta.subtitle} actions={actions} onLogout={() => CJStore.logout()} onOpenDevedor={openDevedor}>
        {screen}
      </AppShell>
      {nav === "config" && <SettingsScreen onClose={() => goNav("dashboard")} pushToast={pushToast} />}
      {detalhe && <DevedorDetail devedor={detalhe} onClose={() => setDetalheId(null)} onNav={goNav} onOpenChat={openChat} pushToast={pushToast} />}
      {chat && <ChatDrawer devedor={chat} onClose={() => setChatId(null)} onOpenDetail={openDevedor} pushToast={pushToast} />}
      <ToastHost toasts={toasts} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
